[pytest]
addopts = -s -v

python_files = test_*.py
python_classes = Test*
python_functions = test_*


markers =
    regression: маркировка для регрессионных тестов
    registration: маркировка для тестов, относящиеся к регистрации
    authorization: маркировка для тестов, относящиеся к авторизации
    courses: маркировка для тестов, относящиеся к курсам
    dashboard: маркировка для тестов, связанных с рабочей панелью

